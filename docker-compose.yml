services:
  postgres:
    image: postgis/postgis:17-master
    environment:
      POSTGRES_DB: opportunity_engine
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: development-only
    ports:
      - "5432:5432"
    volumes:
      - opportunity_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opportunity_postgres_data:
