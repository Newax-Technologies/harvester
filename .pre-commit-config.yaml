repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (frontend)
        entry: frontend/node_modules/.bin/oxlint
        language: system
        files: ^frontend/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: true

      - id: prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write
        language: system
        files: ^frontend/.*\.(ts|tsx|css|json|md)$
        exclude: ^frontend/(node_modules|dist)/
        pass_filenames: true
