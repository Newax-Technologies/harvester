name: Generate Keyword Documentation

on:
  push:
    branches:
      - agent/strengthen-harvester-intelligence-model
    paths:
      - scripts/generate_keyword_docs.py
      - .github/workflows/generate-keyword-docs.yml
      - docs/taxonomy/activity-registry-part-*.md
      - docs/taxonomy/*-domain-registry.md

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/strengthen-harvester-intelligence-model
          fetch-depth: 0

      - name: Generate keyword Markdown files
        run: python3 scripts/generate_keyword_docs.py

      - name: Verify generated coverage
        run: |
          test -f docs/taxonomy/keywords/keyword-registry.md
          test "$(find docs/taxonomy/keywords/domain-keywords -name '*-domain-keywords.md' | wc -l)" -eq 16
          test "$(find docs/taxonomy/keywords -maxdepth 1 -name 'activity-keywords-part-*.md' | wc -l)" -eq 3
          grep -q '1586 canonical product or service domains' docs/taxonomy/keywords/keyword-registry.md
          grep -q '519 canonical business activities' docs/taxonomy/keywords/keyword-registry.md

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- docs/taxonomy/keywords; then
            echo 'Keyword documentation is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/taxonomy/keywords
          git commit -m 'docs: generate complete domain and activity keyword registries'
          git push origin HEAD:agent/strengthen-harvester-intelligence-model
