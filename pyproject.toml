[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lead-harvester"
version = "0.1.0"
description = "Compliant web and social lead discovery, extraction, scoring, deduplication, and export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "NEWAX"}]
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "httpx>=0.28,<1",
  "PyYAML>=6.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.18,<1.19",
  "geoalchemy2>=0.17,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "phonenumbers>=9,<10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  # LinkedIn Stealth Engine
  "camoufox[geoip]>=0.4",
  "playwright>=1.40",
  "openai>=1.0",
  "twocaptcha>=0.0.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "pip-audit>=2.7,<3",
  "pre-commit>=4,<5",
]

[project.scripts]
lead-harvester = "lead_harvester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_harvester"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008 (flake8-bugbear "no function calls in argument defaults") flags
# FastAPI's own Depends(...)/Query(...)/etc. pattern, which is how dependency
# injection is meant to be written in this framework -- not a real bug here.
ignore = ["B008"]
