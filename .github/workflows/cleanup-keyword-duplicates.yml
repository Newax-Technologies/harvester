name: Cleanup Duplicate Keyword Documentation

on:
  push:
    branches:
      - agent/strengthen-harvester-intelligence-model
    paths:
      - .github/workflows/cleanup-keyword-duplicates.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/strengthen-harvester-intelligence-model
          fetch-depth: 0

      - name: Remove duplicate generated taxonomy
        run: |
          rm -rf docs/taxonomy/keywords/domain-keywords
          rm -f docs/taxonomy/keywords/keyword-registry.md
          rm -f docs/taxonomy/keywords/.cleanup-marker
          rm -f scripts/generate_keyword_docs.py
          rm -f .github/workflows/generate-keyword-docs.yml

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No duplicate keyword files remain.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove duplicate keyword taxonomy sources'
          git push origin HEAD:agent/strengthen-harvester-intelligence-model
